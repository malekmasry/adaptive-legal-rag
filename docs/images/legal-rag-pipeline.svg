<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Legal RAG pipeline</title>
  <desc id="desc">Hybrid retrieval and a versioned provision catalog feed source context. A language model drafts and reviews an answer with citations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dabdff"/>
    </marker>
  </defs>
  <rect width="1200" height="398" rx="24" fill="#18132e"/>
  <rect x="1" y="1" width="1198" height="396" rx="23" fill="none" stroke="#726391" stroke-opacity=".65"/>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="39" y="48" fill="#dabdff" font-size="15" font-weight="700" letter-spacing="2.1">ADAPTIVE LEGAL RAG</text>
    <text x="39" y="89" fill="#fff" font-size="31" font-weight="650">From a question to a cited answer</text>
    <g fill="none" stroke="#dabdff" stroke-width="2.4" marker-end="url(#arrow)">
      <path d="M 261 164 H 281 Q 291 164 291 174 V 203 Q 291 213 301 213 H 325"/>
      <path d="M 261 261 H 281 Q 291 261 291 251 V 223 Q 291 213 301 213 H 325"/>
      <path d="M 559 213 H 605"/>
      <path d="M 858 213 H 906"/>
    </g>
    <g fill="#2a2243" stroke="#615179">
      <rect x="39" y="126" width="217" height="76" rx="11"/>
      <rect x="39" y="223" width="217" height="76" rx="11"/>
      <rect x="333" y="155" width="221" height="116" rx="11"/>
      <rect x="613" y="155" width="240" height="116" rx="11"/>
    </g>
    <rect x="914" y="155" width="247" height="116" rx="11" fill="#342051" stroke="#b392e2"/>
    <g fill="#fff" font-size="20" font-weight="650">
      <text x="55" y="156">Hybrid search</text>
      <text x="55" y="253">Provision catalog</text>
      <text x="350" y="186">Source context</text>
      <text x="631" y="186">Draft and review</text>
      <text x="932" y="186">Cited answer</text>
    </g>
    <g fill="#ddd1ec" font-size="15">
      <text x="55" y="181">BM25 · BGE-M3 · Qwen</text>
      <text x="55" y="278">Indexed clauses and offsets</text>
      <text x="350" y="214">Amendments and exceptions</text>
      <text x="350" y="237">Checked notes and arithmetic</text>
      <text x="631" y="214">DeepSeek · question brief</text>
      <text x="631" y="237">Schema and source references</text>
      <text x="932" y="214">Conclusion and clauses</text>
      <text x="932" y="237">Gaps flagged when needed</text>
    </g>
    <path d="M39 330H1161" stroke="#615179"/>
    <text x="39" y="361" fill="#ddd1ec" font-size="15">One core serves the local web interface and CSV batch runner.</text>
  </g>
</svg>
